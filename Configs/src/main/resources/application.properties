
spring.application.name=confere-antes

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:confere-antes}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

jwt.secret=${JWT_SECRET}
jwt.expiration-seconds=3600
server.port=${PORT:8080}

# Gemini remains responsible for processing call audio.
gemini.api-key=${GEMINI_API_KEY:}
gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
gemini.model=${GEMINI_MODEL:gemini-3.8-flash}
gemini.chat-model=${GEMINI_CHAT_MODEL:gemini-2.5-flash}

# OpenRouter remains configured for optional/future use; chat replies use Gemini.
openrouter.api-key=${OPENROUTER_API_KEY:}
openrouter.base-url=${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
openrouter.analysis-model=${OPENROUTER_ANALYSIS_MODEL:inclusionai/ling-3.2-flash:free}
call.audio.max-bytes=${CALL_AUDIO_MAX_BYTES:26214400}
