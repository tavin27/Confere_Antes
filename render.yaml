services:
  - type: web
    name: confere-antes-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: confere-antes-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: confere-antes-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: confere-antes-db
          property: password
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: confere-antes-db
    plan: free
    databaseName: confere_antes
    user: confere_antes
